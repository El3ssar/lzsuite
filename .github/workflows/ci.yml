name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - name: Check installed wheel outside the source tree
        run: |
          uv venv .venv-wheel --python 3.12
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/python -I scripts/check_wheel.py

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest --cov=lzsuite

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
      - name: Check Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --no-project python scripts/check_commit.py --pr-title

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
          python-version: '3.10'
          enable-cache: true
      - name: Test declared minimum NumPy and joblib versions
        run: >-
          uv run --isolated --no-project --python 3.10
          --with . --with numpy==1.24.0 --with joblib==1.5.0 --with pytest
          pytest
