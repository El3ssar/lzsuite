repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: conventional-commit
        name: Conventional Commit subject
        entry: uv run --no-sync python scripts/check_commit.py
        language: system
        stages: [commit-msg]
