site_name: lzsuite
site_description: Lempel–Ziv analysis, discretization, and information distance for multidimensional NumPy arrays.
site_url: https://el3ssar.github.io/lzsuite/
repo_url: https://github.com/El3ssar/lzsuite
repo_name: El3ssar/lzsuite
edit_uri: edit/main/docs/
copyright: © 2026 lzsuite contributors · MIT license
strict: true
theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/favicon.png
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            heading_level: 2
            merge_init_into_class: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/site.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/El3ssar/lzsuite
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/lzsuite/
nav:
  - Overview: index.md
  - Getting started:
      - Installation: guide/installation.md
      - Quickstart: guide/quickstart.md
  - User guide:
      - Contents: guide/index.md
      - Arrays and axes: guide/arrays.md
      - Discretization: guide/discretization.md
      - Custom discretizers: guide/custom-methods.md
      - LZ76 measurements: guide/measures.md
      - Effective measure complexity: guide/emc.md
      - Information distance: guide/distances.md
      - Parallel execution: guide/parallel.md
  - API reference:
      - Overview: api.md
      - Analysis:
          - Functions: reference/analysis.md
          - h: reference/h.md
          - complexity: reference/complexity.md
          - factorization: reference/factorization.md
          - emc: reference/emc.md
          - lz76: reference/lz76.md
      - Distance: reference/distance.md
      - Discretization: reference/discretization.md
      - Built-in methods: reference/methods.md
      - Result conventions: reference/results.md
  - Examples:
      - Contents: gallery/index.md
      - Thresholds and bins: gallery/discretization.md
      - Ordinal patterns: gallery/permutations.md
      - Entropy and complexity: gallery/structure.md
      - Distance matrices: gallery/distances.md
      - Array calculations: gallery/workflows.md
      - Figure generation: gallery/reproduce.md
  - Background:
      - Scientific interpretation: concepts/interpretation.md
      - Troubleshooting: guide/troubleshooting.md
      - Citation: citation.md
  - Development:
      - Contributing: contributing.md
      - Maintenance and releases: maintenance.md
