[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lzsuite"
version = "0.1.0"
description = "Array-oriented Lempel–Ziv analysis and signal discretization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Estévez Moya" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24", "lzcomplexity>=3.0.0,<4", "joblib>=1.5,<2"]

[project.urls]
Homepage = "https://github.com/El3ssar/lzsuite"
Repository = "https://github.com/El3ssar/lzsuite"
Documentation = "https://el3ssar.github.io/lzsuite/"
Issues = "https://github.com/El3ssar/lzsuite/issues"
Changelog = "https://github.com/El3ssar/lzsuite/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "pre-commit>=4", "twine>=6", "ipython>=8.12"]
docs = [
    "matplotlib>=3.8,<4",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=1,<2",
    "numpydoc>=1.8,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lzsuite"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "scripts/", "Makefile", "CITATION.cff", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "mkdocs.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["lzsuite"]

[tool.coverage.report]
show_missing = true
